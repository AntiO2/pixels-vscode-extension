name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  core-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install upstream Reader compile dependency
        # Used only by the native compile/test job; it is not a packaged runtime dependency.
        run: sudo apt-get update && sudo apt-get install --yes liburing-dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native sanitizer and generated Node/Chromium Worker corpus
        timeout-minutes: 30
        run: node scripts/test-worker-corpus.mjs

  scan-node-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npm run test:scan-real

  generic-vsix-audit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: pixels-pxl-inspector-generic
          path: out/vsix/pixels-pxl-inspector-*.vsix
          if-no-files-found: error

  package:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:core
      - name: Record shared WASM digest
        run: sha256sum resources/core/pixels-inspector-wasm.wasm
      - run: npm run package:target -- ${{ matrix.target }}
      - name: Verify packaged WASM identity
        run: |
          expected="$(sha256sum resources/core/pixels-inspector-wasm.wasm | cut -d' ' -f1)"
          actual="$(unzip -p out/vsix/pixels-pxl-inspector-${{ matrix.target }}-0.1.0.vsix extension/resources/core/pixels-inspector-wasm.wasm | sha256sum | cut -d' ' -f1)"
          test "$expected" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: pixels-pxl-inspector-${{ matrix.target }}
          path: out/vsix/*.vsix
          if-no-files-found: error
